<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geovisor Porto</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      // Inicializa mapa centrado en Porto.
      const map = L.map('map', {
        zoomControl: true,
      }).setView([41.15, -8.61], 12);

      // Capa base OpenStreetMap.
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // GeoJSON público (raw en GitHub).
      const geoJsonUrl =
        'https://raw.githubusercontent.com/DanielVanegas/porto-accessibility/main/results/bike_access_metro.geojson';

      // Carga y dibuja GeoJSON.
      fetch(geoJsonUrl)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`No se pudo cargar el GeoJSON: ${response.status}`);
          }
          return response.json();
        })
        .then((geojson) => {
          const layer = L.geoJSON(geojson, {
            style: {
              color: '#1d4ed8',
              weight: 2,
              fillOpacity: 0.25,
            },
            pointToLayer: (feature, latlng) =>
              L.circleMarker(latlng, {
                radius: 5,
                color: '#1d4ed8',
                fillColor: '#60a5fa',
                fillOpacity: 0.9,
              }),
          }).addTo(map);

          // Ajusta el encuadre al contenido cargado cuando sea posible.
          const bounds = layer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [20, 20] });
          }
        })
        .catch((error) => {
          console.error(error);
          alert('Error al cargar el GeoJSON. Revisa la consola para más detalle.');
        });
    </script>
  </body>
</html>
