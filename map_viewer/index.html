<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VanegasGeomatics MapViewer</title>

    <!-- Site styles -->
    <link rel="stylesheet" href="https://www.vanegasgeomatics.com/static/styles.css" />
    <link rel="icon" type="image/x-icon" href="https://www.vanegasgeomatics.com/assets/favicon_mapviewer.ico">
    <link rel="shortcut icon" href="https://www.vanegasgeomatics.com/assets/favicon_mapviewer.ico">

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>

  <body>
    <main class="container-full stack">
      <section class="card section-card map-wrapper">
        <header>
          <h1 class="map-title">VanegasGeomatics MapViewer</h1>
          <p class="map-subtitle">
            Web map platform for geographic representation of projects, spatial analysis and decision-support tools.
          </p>
        </header>

        <div class="map-container">
          <div id="map"></div>
        </div>
      </section>
    </main>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      // Initialize map centered on Porto
      const map = L.map("map", {
        zoomControl: true,
      }).setView([41.15, -8.61], 12);

      // OpenStreetMap base layer
      const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // Layer configuration
      const layerConfigs = [
        {
          name: "Bike accessibility",
          url: "https://raw.githubusercontent.com/DanielVanegas/porto-accessibility/main/results/bike_access_metro.geojson",
          color: "#1f6feb",
        },
        {
          name: "Walk accessibility",
          url: "https://raw.githubusercontent.com/DanielVanegas/porto-accessibility/main/results/walk_access_metro.geojson",
          color: "#16a34a",
        },
      ];

      const overlayLayers = {};

      function createGeoJsonLayer(geojson, color) {
        return L.geoJSON(geojson, {
          style: {
            color: color,
            weight: 2,
            fillOpacity: 0.25,
          },
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 5,
              color: color,
              fillColor: color,
              fillOpacity: 0.8,
            }),
          onEachFeature: (feature, layer) => {
            let content = "<b>Attributes</b><br>";
            for (const key in feature.properties) {
              content += `<b>${key}:</b> ${feature.properties[key]}<br>`;
            }
            layer.bindPopup(content);
          },
        });
      }

      // Load all layers
      Promise.all(
        layerConfigs.map((cfg) =>
          fetch(cfg.url)
            .then((r) => r.json())
            .then((geojson) => {
              const layer = createGeoJsonLayer(geojson, cfg.color);
              overlayLayers[cfg.name] = layer;
              layer.addTo(map);
              return layer;
            })
        )
      ).then((layers) => {
        const bounds = layers[0].getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [20, 20] });
        }

        L.control.layers(
          { "OpenStreetMap": osm },
          overlayLayers,
          { collapsed: false }
        ).addTo(map);
      });
    </script>
  </body>
</html>
